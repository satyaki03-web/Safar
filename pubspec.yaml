name: safar
description: Peer-to-peer Driver-as-a-Service marketplace for Kolkata, India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.0.0
  
  # Models & Immutability
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Firebase Backend
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19
  firebase_crashlytics: ^3.4.18
  
  # Maps, Routing & Geolocation
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  google_places_flutter: ^2.0.8
  flutter_polyline_points: ^2.0.0
  flutter_foreground_task: ^6.1.1
  
  # UI, Icons, Typography
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/map_styles/
